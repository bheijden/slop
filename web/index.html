<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slop</title>
<meta name="description" content="Lint prose for stock language-model phrasing. Nothing leaves your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='26' font-family='Georgia,serif' fill='%23C2403C'%3E%C2%B6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
/* only what the check page adds to the shell */
/* the results header in rules mode */
#list-head .bad{color:var(--flag)}
#list-head .tot{color:var(--muted);margin-left:10px;text-transform:none;letter-spacing:0}
/* The findings list. app.css styles a list of words picked from; a finding is
   a different shape: a location, then a rule name, the match and the fix. */
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 10px;
  border-bottom:1px solid var(--hair);cursor:pointer;border-radius:0;align-items:start}
.list li:hover{background:var(--sunk)}
.list li.on{background:var(--sunk);box-shadow:inset 2px 0 0 var(--flag)}
.list .loc{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;text-align:right}
.list .cnt{text-align:left;cursor:help;border-bottom:1px dotted var(--hair)}
.list .rid{color:var(--flag);font-weight:500}
.list .m{font-family:var(--serif);font-size:15px;margin:2px 0 3px}
.list .fix{color:var(--muted);font-size:11.5px;line-height:1.55}
.list li.fgroup{display:block;position:sticky;top:0;z-index:1;background:var(--paper);cursor:default;
  border-bottom:1px solid var(--hair);color:var(--muted);font-size:11.5px;
  padding:6px 10px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li.fgroup:hover{background:var(--paper)}
.list li.none{display:block;color:var(--muted);font-size:11.5px;padding:7px 10px;cursor:default}
.list li.none:hover{background:none}
.rate{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin:3px 0 1px}
.rate b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.rate .ru{color:var(--muted);font-size:11.5px}
.rate .rb{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;color:var(--flag);
  border:1px solid var(--hair);border-radius:999px;padding:1.5px 7px;white-space:nowrap}
/* The text you paste and the findings on it are one surface, in two layers.
   The textarea is underneath with a visible caret and transparent text; the
   highlighted copy is on top and ignores the pointer except on the marks. A
   click lands where you aimed it, and a hover over a finding still opens it. */
.surface{position:relative;flex:1 1 auto;min-height:0}
.surface > #input,.surface > #doc{
  position:absolute;inset:0;margin:0;width:100%;height:100%;overflow:auto;
  padding:12px 14px 22px;border:0;font-family:var(--mono);font-size:12.5px;line-height:1.7;
  white-space:pre-wrap;overflow-wrap:break-word;scrollbar-width:thin;
}
.surface > #input{background:none;color:transparent;caret-color:var(--ink);resize:none;z-index:1}
.surface > #input:focus{outline:none}
.surface > #input::placeholder{color:var(--muted)}
.surface > #doc{z-index:2;pointer-events:none;background:none}
.surface > #doc mark{pointer-events:auto}
#pane-doc[data-edit=off] .surface > #input{display:none}
#pane-doc[data-edit=off] .surface{position:static}
#pane-doc[data-edit=off] .surface > #doc{position:static;height:auto;pointer-events:auto;overflow:visible}
body.dragging #pane-doc{background:var(--sunk)}

/* the rule set being tested shares the same slot as the text */
#rules-src{display:none;flex:1;min-height:0;width:100%;border:0;background:none;resize:none;
  padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.6;scrollbar-width:thin}
body[data-mode=fudge] #rules-src{display:block}
body[data-mode=fudge] .surface{display:none}
.rerr{margin:0;padding:8px 14px;color:var(--flag);font-size:11.5px;border-top:1px solid var(--hair)}

/* the rules pane */
#rules{padding:0}
#pane-rules .load{padding:10px 14px;border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;gap:6px}
#pane-rules .load input{flex:1;min-width:0;background:var(--sunk);border:1px solid var(--hair);
  border-radius:6px;padding:3px 7px;font-size:11.5px}
/* Two voices: everything the linter says is monospace, everything you wrote
   is serif. Light is the default; the toggle in the bar wins over the OS. */
:root{
  /* Three clear surfaces rather than three near-identical ones: the page sits
     back, cards come forward, code blocks recess. */
  --paper:#EDEDE9; --card:#FDFDFC; --sunk:#E0E0DA; --hair:#D4D4CC;
  --ink:#14161A; --muted:#5C5F66; --blue:#2D5BD6; --flag:#B93B37; --ok:#2E7D4F;
  --mark:#FCE79B; --mark-edge:#D4A62E; --mark-on:#F9DA6B; --mark-ink:#14161A;
  --lift:0 1px 2px rgba(20,22,26,.05), 0 1px 1px rgba(20,22,26,.04);
  /* Side margin grows with the window up to a cap, then the content takes the
     rest of the width rather than sitting in a fixed column. */
  --gutter:clamp(16px, 4vw, 112px);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Newsreader",Georgia,"Iowan Old Style",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --paper:#0F1115; --card:#191C22; --sunk:#23262E; --hair:#31353E;
    --ink:#E8E8E3; --muted:#8B8F98; --blue:#84A6FF; --flag:#E86B60; --ok:#6FBF8B;
    --mark:rgba(250,208,105,.20); --mark-edge:#A8842A; --mark-on:rgba(250,208,105,.40); --mark-ink:#F6F0E0;
    --lift:0 1px 2px rgba(0,0,0,.4), 0 1px 1px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --paper:#0F1115; --card:#191C22; --sunk:#23262E; --hair:#31353E;
  --ink:#E8E8E3; --muted:#8B8F98; --blue:#84A6FF; --flag:#E86B60; --ok:#6FBF8B;
  --mark:rgba(250,208,105,.20); --mark-edge:#A8842A; --mark-on:rgba(250,208,105,.40); --mark-ink:#F6F0E0;
  --lift:0 1px 2px rgba(0,0,0,.4), 0 1px 1px rgba(0,0,0,.3);
  color-scheme:dark;
}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
[hidden]{display:none!important}
/* bar */
.score.zero b{color:var(--blue)}
/* page */
/* The page grows with the window. Individual blocks cap their own measure in
   ch, so a wider window gives more room to the panes rather than longer lines
   of prose. */
/* The text you paste and the findings on it are the same surface, in two
   layers. The textarea is underneath with a visible caret and transparent
   text; the highlighted copy is on top and ignores the pointer except on the
   marks themselves. A click lands where you aimed it, and a hover over a
   finding still opens the finding. */
body.dragging #pane-doc{border-color:var(--blue);background:var(--sunk)}
/* Reading mode: the stripped prose, no caret, the whole thing clickable. */
/* Everything after this sits at the right end: what the document is, not what
   you can do to it. */
/* results */
/* panes */
/* A file tree appears beside the panes only when more than one document is
   loaded, so the single-document layout is untouched. */
/* Pinned columns, so hiding the list does not slide the panes across. */
@media(max-width:820px){
}
/* Two panes and a divider you can drag, or step left/right to collapse a side. */
/* Pin each child to its column. Without this, `display:none` on a collapsed
   pane drops it from the flow and the rest slide left, so the findings pane
   would inherit the divider's 44px column. */
/* The text pane is a column: its header, then a surface taking what is left.
   The pane itself must not scroll while editing — the surface inside does. */
/* The control sits at the middle of the divider, where you would reach for it. */
body.resizing{cursor:col-resize;user-select:none}
@media(max-width:820px){
}
#doc.prose{font-family:var(--serif);font-size:18px;line-height:1.62}
#doc.prose p{margin:0 0 .8em}
#doc.source{font-family:var(--mono);font-size:12.5px;line-height:1.75}
#doc.source p{margin:0;white-space:pre-wrap;word-break:break-word;min-height:1.75em}
#doc p{word-break:break-word}
.filesec + .filesec{margin-top:26px;padding-top:4px}
.fname{
  position:sticky;top:0;z-index:1;margin:0 0 10px;padding:5px 0 6px;
  background:var(--paper);border-bottom:1px solid var(--hair);
  display:flex;gap:10px;align-items:baseline;
  font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--muted);
}
.fname .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.fname .ct{color:var(--flag);font-variant-numeric:tabular-nums}
.fname .ct.clean{color:var(--muted);font-weight:400}
#doc mark{
  background:var(--mark);color:var(--mark-ink);
  box-shadow:inset 0 -2px 0 var(--mark-edge);
  border-radius:2px;padding:.5px 1px;cursor:pointer;
}
#doc mark:hover,#doc mark.on{background:var(--mark-on)}
/* A doc-level finding measures the whole document, so it shows a rate rather
   than a quoted phrase: what the document reached, the edge it crossed, and
   the count the rate was computed from. */
.rate{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin:3px 0 1px}
.rate b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.rate .ru{color:var(--muted);font-size:11.5px}
.rate .rb{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;
  color:var(--flag);border:1px solid var(--hair);border-radius:999px;
  padding:1.5px 7px;white-space:nowrap}
.rsub{color:var(--muted);font-size:11.5px;margin:0 0 3px;font-variant-numeric:tabular-nums}
/* The hover card is narrower than the list row and sits above the fix, which
   carries its own rule, so the rate needs a little more room under it. */
.tip .rate{margin-top:4px}
.tip .rate b{font-size:17px}
.tip .rsub{margin-bottom:6px}
/* An occurrence behind a rate is evidence for a measurement, not a flagged
   phrase, so it is underlined rather than filled in until it is selected. */
#doc mark.occ{background:none;box-shadow:inset 0 -1px 0 var(--mark-edge)}
#doc mark.occ:hover,#doc mark.occ.on{background:var(--mark-on);box-shadow:inset 0 -2px 0 var(--mark-edge)}
/* the rules control: a panel under the bar, not a documentation section */
/* hover card */
.tip{
  position:fixed;z-index:60;max-width:340px;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--card);border:1px solid var(--hair);border-radius:8px;padding:9px 11px;
  box-shadow:0 12px 32px -10px rgba(0,0,0,.30);font-size:11.5px;line-height:1.55;
}
.tip.on{opacity:1}
.tip-head{display:flex;gap:8px;align-items:baseline}
.tip .rid{color:var(--flag);font-weight:600}
.tip-count{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;margin-top:3px}
.tip .set{color:var(--muted);font-size:11px;margin-left:auto}
.tip-name{font-family:var(--serif);font-size:15px;line-height:1.3;margin:3px 0 5px;color:var(--ink)}
.tip-why{color:var(--muted);line-height:1.5}
.offtag{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--hair);border-radius:3px;padding:0 3px;margin-left:5px}
.tip-fix{color:var(--ink);margin-top:6px;padding-top:6px;border-top:1px solid var(--hair)}
/* fudge */
.frow{display:grid;grid-template-columns:1fr 92px 92px;gap:14px;padding:5px 0;border-bottom:1px solid var(--hair);align-items:baseline}
.frow.head{border-bottom:1px solid var(--ink);padding-bottom:6px}
.frow.head span{color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase}
.frow .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.frow.bad,.frow.bad .num{color:var(--flag)}
.frow .why{grid-column:1/-1;color:var(--flag);font-size:11.5px;padding-left:12px;border-left:2px solid var(--flag);margin:3px 0 5px;white-space:pre-wrap;word-break:break-word}
.tallies{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:18px}
.tallies .big{font-family:var(--serif);font-size:26px;letter-spacing:-.02em}
.tallies .big.bad{color:var(--flag)}
.tallies .lbl{color:var(--muted);font-size:11.5px}
/* disclosures */
.copy-pre{
  position:absolute;top:6px;right:6px;z-index:2;
  border:1px solid var(--hair);background:var(--paper);color:var(--muted);
  border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;
  opacity:0;transition:opacity .12s;
}
.copy-pre:hover{border-color:var(--blue);color:var(--ink)}
.copy-pre.done{opacity:1;border-color:var(--blue);color:var(--blue)}
@media (hover:none){.copy-pre{opacity:1}}
.rulebox{}
.rset{border-bottom:1px solid var(--hair)}
.rset:first-child{border-top:1px solid var(--hair)}
.rset summary{
  cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;
  padding:8px 2px;font-size:12px;
}
.rset summary::-webkit-details-marker{display:none}
.rset summary::before{content:"+";color:var(--blue);width:9px;flex:none;font-size:11px}
.rset[open] summary::before{content:"−"}
/* In test-rules mode the document pane holds the rule set you are editing and
   the findings pane holds what the tests made of it, so the split, the divider
   and the collapse arrows all work exactly as they do for prose. */
#rules-src{
  display:none;width:100%;min-height:100%;box-sizing:border-box;resize:none;
  border:0;background:none;padding:2px 0 0;color:inherit;
  font-family:var(--mono);font-size:12.5px;line-height:1.7;tab-size:2;
}
#rules-src:focus{outline:none}
#rules-src::placeholder{color:var(--muted)}
.rtools{display:flex;gap:7px;align-items:center;width:100%}
.rtools .n{margin-left:auto;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.rerr{margin:8px 0 0;font:12px/1.5 var(--mono);color:var(--flag);cursor:pointer}
.rerr:hover{text-decoration:underline;text-underline-offset:3px}
/* the rule-writing sections only belong to that mode */
/* a result row points back at the rule that produced it */
/* only the phase that actually failed is marked, so the two are never read
   as one pool with one failure count between them */
#list-head .bad{color:var(--flag)}
#list-head .tot{margin-left:auto;text-transform:none;letter-spacing:0;opacity:.7}
/* a result row points back at the rule that produced it */
.frow.click{cursor:pointer}
.frow.click:hover span:first-child{text-decoration:underline;text-underline-offset:3px}
.frow .why{cursor:pointer}
.frow .why:hover{background:var(--sunk)}
.frow .why b{font-weight:600;color:var(--flag)}
/* The set box is the whole set in one click. Indeterminate means partly on,
   which is the honest third state for a set you have picked rules out of. */
.rset summary .setbox{flex:none;margin:0;cursor:pointer}
.rset summary .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rset summary .hits{color:var(--flag);font-weight:600;font-variant-numeric:tabular-nums}
.rset summary .cnt{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.rset summary button{background:none;border:0;color:var(--blue);cursor:pointer;font-size:11px;padding:0 2px}
.rlist{padding:2px 0 9px 17px}
.rulebox label{display:flex;gap:8px;align-items:baseline;padding:2.5px 0;cursor:pointer;font-size:12px}
.rulebox label input{margin:0;flex:none;accent-color:var(--blue)}
.rulebox label .id{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rulebox label .n{color:var(--flag);font-variant-numeric:tabular-nums;font-weight:500}
.err{color:var(--flag);font-size:11.5px}
@media (max-width:640px){.page{padding-top:20px;padding-bottom:60px}.hero h1{font-size:32px}#doc.prose{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-page="check">

<div class="dash">

  <button class="themer" id="theme" title="Theme: follow the system, light, or dark" aria-label="Change the theme">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <g class="a"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5a6.5 6.5 0 0 0 0 13z" fill="currentColor" stroke="none"/></g>
        <g class="s"><circle cx="10" cy="10" r="3.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.6 4.6l1.4 1.4M14 14l1.4 1.4M15.4 4.6L14 6M6 14l-1.4 1.4"/></g>
        <g class="m"><path d="M15.5 12.4A6.5 6.5 0 0 1 7.6 4.5a6.5 6.5 0 1 0 7.9 7.9z"/></g>
      </svg>
    </button>

  <div class="cell pad mast">
    <h1>slop<em>.</em></h1>
    <nav class="modes">
      <a href="./" aria-current="page">check</a>
      <a href="rules.html">rule sets</a>
      <a href="vocabulary.html">vocabulary</a>
    </nav>
  </div>

  <div class="cell tally" id="tally"></div>

  <div class="cell pad say">
    <p>A linter for prose. It flags stock language-model phrasing &mdash;
      <b>it is important to note that</b>, <b>no X, no Y, no Z</b> &mdash; at the line it came
      from, with a fix. Nothing leaves your browser.</p>
    <p class="dim" id="loaded" hidden></p>
    <aside class="tree" id="tree" hidden></aside>
    <div class="more" id="doc-tools">
      <button id="b-example">Load an example</button>
      <button id="b-file">Choose a file</button>
      <a href="https://github.com/bheijden/slop">Source and rule format</a>
    </div>
  </div>

  <div class="cell big" id="pane-doc" data-edit="on">
    <header>
      <div class="seg" id="views">
        <button id="v-source" aria-pressed="true">your text</button>
        <button id="v-prose" aria-pressed="false">what it reads</button>
      </div>
      <span class="spacer"></span>
      <select id="kind" class="chip" aria-label="How to parse the input">
        <option value="md">markdown</option>
        <option value="html">html</option>
        <option value="txt">plain text</option>
      </select>
    </header>
    <div class="surface">
      <textarea id="input" spellcheck="false"
        placeholder="Paste text here, or drop files, a folder or a .zip anywhere on the page."></textarea>
      <div id="doc" class="source"></div>
    </div>
  </div>

  <div class="cell quiet" id="pane-rules">
    <header><span class="title">rules</span><span class="spacer"></span><span class="dim" id="rule-hint"></span></header>
    <div class="body" id="rules"></div>
  </div>

  <div class="cell" id="pane-list">
    <header>
      <span class="title" id="list-head">findings</span>
      <span class="spacer"></span>
      <span class="nav" id="nav" hidden>
        <button class="chip" id="n-prev" title="Previous finding (k or up)" aria-label="Previous finding">&uarr;</button>
        <span class="dim" id="n-count">&middot;</span>
        <button class="chip" id="n-next" title="Next finding (j or down)" aria-label="Next finding">&darr;</button>
      </span>
      <button class="chip" id="b-copy" hidden title="Copy the findings as JSON">copy JSON</button>
    </header>
    <ol class="list" id="list"></ol>
    <textarea id="copy-fallback" hidden aria-label="Findings JSON, select and copy"></textarea>
  </div>

</div>

<div class="tip" id="tip"></div>

<script type="module" src="app.mjs"></script>
<script type="module" src="install.mjs"></script>
</body>
