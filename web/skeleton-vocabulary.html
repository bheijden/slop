<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slop · vocabulary</title>
<meta name="description" content="The vocabulary that arrives with the machines, derived from public GitHub pull requests.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='26' font-family='Georgia,serif' fill='%23C2403C'%3E%C2%B6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  /* three panels: the clusters over time, the words in one, and one word */
  .work{--work:"chart chart" minmax(180px,1fr)
                "words  word" minmax(240px,1.15fr) / minmax(240px,1fr) minmax(0,1.9fr)}
  #p-chart{grid-area:chart} #p-words{grid-area:words} #p-word{grid-area:word}
</style>
</head>
<body>
<div class="app">
  <div class="rail"></div>
  <div class="work">
    <section class="panel" id="p-chart">
      <header><span class="title">clusters over time</span><span class="spacer"></span></header>
      <div class="body"></div>
    </section>
    <section class="panel quiet" id="p-words">
      <header><span class="title">words</span><span class="spacer"></span></header>
      <div class="body"></div>
    </section>
    <section class="panel" id="p-word">
      <header><span class="title">selected word</span><span class="spacer"></span></header>
      <div class="body"></div>
    </section>
  </div>
</div>
<script type="module">
import { rail } from './shell.mjs';
rail('vocabulary', '<h2>skeleton</h2><p class="dim">context goes here</p>');
</script>
</body>
</html>
