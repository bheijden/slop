<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slop · vocabulary</title>
<meta name="description" content="The vocabulary of machine-written prose, derived daily from public GitHub pull request descriptions.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='26' font-family='Georgia,serif' fill='%23C2403C'%3E%C2%B6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
/* Same three surfaces, same two faces, as the rest of the site. */
:root{
  --paper:#EDEDE9; --card:#FDFDFC; --sunk:#E0E0DA; --hair:#D4D4CC;
  --ink:#14161A; --muted:#5C5F66; --blue:#2D5BD6; --flag:#B93B37; --ok:#2E7D4F;
  --lift:0 1px 2px rgba(20,22,26,.05), 0 1px 1px rgba(20,22,26,.04);
  --gutter:clamp(16px, 4vw, 112px);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Newsreader",Georgia,"Iowan Old Style",serif;
  /* One hue per signing tool. Ordered by how much of the corpus each carries,
     so the largest band is the most saturated and the tail stays quiet. */
  --p0:#2D5BD6; --p1:#B93B37; --p2:#2E7D4F; --p3:#8A5CD6; --p4:#C07C1E;
  --p5:#0F8B8D; --p6:#9C4A7A; --p7:#5C6470; --p8:#7A8B2E;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --paper:#0F1115; --card:#191C22; --sunk:#23262E; --hair:#31353E;
    --ink:#E8E8E3; --muted:#8B8F98; --blue:#84A6FF; --flag:#E86B60; --ok:#6FBF8B;
    --lift:0 1px 2px rgba(0,0,0,.4), 0 1px 1px rgba(0,0,0,.3);
    --p0:#84A6FF; --p1:#E86B60; --p2:#6FBF8B; --p3:#B79BFF; --p4:#E0A945;
    --p5:#4FC3C5; --p6:#D68CB4; --p7:#9AA3B0; --p8:#B5C95B;
    color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --paper:#0F1115; --card:#191C22; --sunk:#23262E; --hair:#31353E;
  --ink:#E8E8E3; --muted:#8B8F98; --blue:#84A6FF; --flag:#E86B60; --ok:#6FBF8B;
  --lift:0 1px 2px rgba(0,0,0,.4), 0 1px 1px rgba(0,0,0,.3);
  --p0:#84A6FF; --p1:#E86B60; --p2:#6FBF8B; --p3:#B79BFF; --p4:#E0A945;
  --p5:#4FC3C5; --p6:#D68CB4; --p7:#9AA3B0; --p8:#B5C95B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;border-radius:2px}
a{color:var(--blue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* One screen, six cells, hairlines between. Nothing scrolls but the word list.
   The proportions come from the content: the left column is as wide as a word
   list needs and no wider, the arrival chart gets the tallest cell because it
   is the only thing here that shows twenty months at once. */
.dash{display:grid;height:100dvh;
  grid-template-columns:minmax(280px,25%) 1fr;
  grid-template-rows:auto minmax(180px,1fr) minmax(240px,1.25fr);
  background:var(--hair);gap:1px}
.cell{background:var(--paper);min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.cell.pad{padding:14px 18px}

/* masthead */
.mast{justify-content:center}
.mast h1{font-family:var(--serif);font-weight:500;font-size:clamp(19px,2.3vw,30px);line-height:1.06;margin:0;letter-spacing:-.015em}
.mast h1 em{font-style:normal;color:var(--flag)}
.mast .modes{display:flex;gap:2px;margin-top:9px}
.mast .modes a{padding:2px 8px;border-radius:5px;text-decoration:none;color:var(--muted);font-size:11.5px}
.mast .modes a[aria-current=page]{background:var(--sunk);color:var(--ink)}

/* the three counts */
.tally{flex-direction:row;align-items:stretch;gap:0}
.tally div{flex:1;padding:14px 18px;display:flex;flex-direction:column;justify-content:center;gap:2px;position:relative}
.tally div+div{box-shadow:inset 1px 0 0 var(--hair)}
.tally b{font-size:clamp(17px,2vw,26px);font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.tally span{color:var(--muted);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.tally i{display:block;height:3px;border-radius:2px;margin-bottom:9px;width:44px}

/* the prose cell */
.say{gap:8px;overflow:auto;scrollbar-width:thin}
.say p{margin:0;color:var(--muted);max-width:46ch}
.say p b{color:var(--ink);font-weight:600}
.say .more{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:auto;padding-top:10px}
.say .more button,.say .more a{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;font-size:11.5px}

/* the chart cell */
.chart{position:relative}
.capbar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--hair);
  color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden}
.capbar b{color:var(--ink);font-weight:600}
.capbar .spacer{flex:1}
.pager{display:flex;align-items:center;gap:5px;flex:none}
.pager button{background:none;border:1px solid var(--hair);border-radius:5px;width:20px;height:20px;
  display:grid;place-items:center;color:var(--muted);cursor:pointer;font-size:11px;padding:0;line-height:1}
.pager button:hover{background:var(--sunk);color:var(--ink)}
.pager .which{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pager .tag{color:var(--flag);font-size:10px;letter-spacing:.05em;text-transform:uppercase}
.plot{flex:1;min-height:0;padding:6px 14px 4px}
svg{display:block;width:100%;height:100%}
.axis{fill:var(--muted);font-size:10px}
.grid{stroke:var(--hair);stroke-width:1}
.one{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}

/* the word list */
.find{padding:8px 12px;border-bottom:1px solid var(--hair);display:flex;gap:6px;align-items:center}
.find input{flex:1;min-width:0;background:var(--sunk);border:1px solid var(--hair);border-radius:6px;padding:4px 8px}
.tabs{display:flex;gap:2px;flex:none}
.tabs button{background:none;border:0;padding:3px 8px;border-radius:5px;color:var(--muted);cursor:pointer;font-size:11px}
.tabs button[aria-pressed=true]{background:var(--sunk);color:var(--ink)}
.strip{padding:6px 12px;border-bottom:1px solid var(--hair);color:var(--muted);font-size:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.list{list-style:none;margin:0;padding:3px;overflow:auto;scrollbar-width:thin;flex:1;min-height:0}
.list li{display:grid;grid-template-columns:28px 1fr auto;gap:7px;align-items:center;padding:3px 7px;border-radius:5px;cursor:pointer}
.list li:hover{background:var(--sunk)}
.list li[aria-selected=true]{background:var(--sunk);box-shadow:inset 2px 0 0 var(--flag)}
.list .n{color:var(--muted);font-size:10.5px;text-align:right;font-variant-numeric:tabular-nums}
.list .w{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .x{color:var(--flag);font-variant-numeric:tabular-nums;font-size:11px}

/* the selected word */
.word-head{padding:12px 16px 8px}
.word-head .big{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.word-head .w{font-family:var(--serif);font-size:clamp(22px,2.6vw,32px);line-height:1}
.word-head .x{font-size:clamp(19px,2.2vw,26px);font-weight:600;color:var(--flag);font-variant-numeric:tabular-nums}
.word-head .u{color:var(--muted);font-size:11px}
.facts{display:flex;flex-wrap:wrap;gap:1px 18px;margin-top:6px;color:var(--muted);font-size:11px}
.facts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.facts .sig b{color:var(--flag)}

/* the overlays that hold everything that is not a number */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:40;padding:4vh 4vw}
.sheet[open]{display:grid;place-items:center}
.sheet > div{background:var(--paper);border:1px solid var(--hair);border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.3);
  max-width:min(900px,94vw);max-height:92vh;overflow:auto;padding:22px 26px;scrollbar-width:thin}
.sheet h2{font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 4px}
.sheet .close{position:sticky;top:0;float:right;background:none;border:1px solid var(--hair);border-radius:6px;
  width:24px;height:24px;color:var(--muted);cursor:pointer;line-height:1}
.sheet dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0 24px;margin:12px 0 0}
.sheet dt{font-weight:600;margin-top:12px}
.sheet dt:first-of-type{margin-top:0}
.sheet dd{margin:2px 0 0;color:var(--muted)}
.sheet dd em{font-style:normal;color:var(--ink)}
.sheet p{color:var(--muted);max-width:74ch}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px}
@media (max-width:640px){.sheet .two{grid-template-columns:1fr}}
.sheet ol{list-style:none;margin:6px 0 0;padding:0;counter-reset:v}
.sheet .two li{counter-increment:v;display:grid;grid-template-columns:20px 1fr auto;gap:7px;padding:2px 0;align-items:baseline}
.sheet .two li::before{content:counter(v);color:var(--muted);font-size:10.5px;text-align:right}
.sheet .two h3{margin:0;font-size:12px;font-weight:600}
.sheet .two .x{color:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.sheet .two .kept .x{color:var(--flag)}
.chip{background:none;border:1px solid var(--hair);border-radius:6px;padding:2px 8px;color:var(--muted);cursor:pointer;font-size:11px}

/* Under about 900px a six-cell dashboard stops being one, so it becomes a
   column that scrolls, with each cell given a workable height of its own. */
@media (max-width:900px){
  body{overflow:auto}
  .dash{height:auto;grid-template-columns:1fr;grid-template-rows:none}
  .cell{min-height:0}
  .chart{min-height:300px}
  .cell.words{min-height:340px}
  .cell.detail{min-height:330px}
}
</style>
</head>
<body data-built="2026-09-03-7-250">

<div class="dash">

  <div class="cell pad mast">
    <h1>The vocabulary that<br>arrives with the <em>machines</em></h1>
    <nav class="modes">
      <a href="./">check</a>
      <a href="./?mode=fudge">test rules</a>
      <a href="vocabulary.html" aria-current="page">vocabulary</a>
      <button class="chip" id="theme" style="margin-left:6px" title="Light, dark, or whatever the system says">auto</button>
    </nav>
  </div>

  <div class="cell tally" id="tally"></div>

  <div class="cell pad say">
    <p id="say1">Reading the sample&hellip;</p>
    <p id="say2"></p>
    <p id="say3"></p>
    <div class="more">
      <a href="https://github.com/bheijden/slop/blob/main/docs/vocabulary.md">How this was done.</a>
      <a href="./">Try it on your own writing.</a>
    </div>
  </div>

  <div class="cell chart">
    <div class="capbar">
      <span>change cluster</span>
      <div class="pager">
        <button id="prev" aria-label="Previous cluster">&lsaquo;</button>
        <span class="which" id="which">01 / 05</span>
        <button id="next" aria-label="Next cluster">&rsaquo;</button>
      </div>
      <span class="spacer"></span>
      <span id="acap"></span>
    </div>
    <div class="plot"><svg id="arrive" role="img" aria-labelledby="arrive-t"><title id="arrive-t">Each group's share of all sampled pull request descriptions, by week</title></svg></div>
  </div>

  <div class="cell words">
    <div class="find">
      <input id="q" type="search" placeholder="search for a word" aria-label="Search the word list">
    </div>
    <div class="strip" id="about">scroll &middot; most representative first</div>
    <ul class="list" id="list" role="listbox" aria-label="Derived vocabulary"></ul>
  </div>

  <div class="cell detail">
    <div class="word-head" id="whead"></div>
    <div class="plot"><svg id="rate" role="img" aria-labelledby="rate-t"><title id="rate-t">How often the word is written each week, signed against all</title></svg></div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString('en');
const pc = (v) => (v * 100).toFixed(1) + '%';
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

/* theme, same three states as the rest of the site */
const theme = $('theme');
const setTheme = (v) => {
  if (v === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', v);
  theme.textContent = v;
  try { localStorage.setItem('slop-theme', v); } catch (e) { /* private window */ }
};
let saved = 'auto';
try { saved = localStorage.getItem('slop-theme') || 'auto'; } catch (e) { /* ditto */ }
setTheme(saved);
theme.onclick = () => setTheme({ auto: 'light', light: 'dark', dark: 'auto' }[theme.textContent] || 'auto');

let DATA = null, SELECTED = null, GROUP = 0;
const groupAt = () => DATA.browse[GROUP];
const rows = () => groupAt().words;

// The catch belongs to the fetch, not to render(). Chaining it after render()
// reports every drawing bug as a missing file, which cost an hour once.
fetch('vocabulary-data.json?v=' + (document.body.dataset.built || ''))
  .then((r) => r.json())
  .catch(() => { $('say1').textContent = 'Could not load vocabulary-data.json.'; return null; })
  .then((d) => { if (d) { DATA = d; render(); } });

function render() {
  const s = DATA.sample, f = DATA.fit;
  const hist = DATA.history;
  const words = hist.weeks.reduce((a, e) => a + e.words, 0);
  $('tally').innerHTML = [
    ['var(--p1)', fmt(s.days), 'days'],
    ['var(--p0)', fmt(s.descriptions), 'pull requests'],
    ['var(--p4)', fmt(words), 'words'],
  ].map(([c, n, l]) => `<div><i style="background:${c}"></i><b>${n}</b><span>${l}</span></div>`).join('');

  const hw = DATA.history.weeks, wk1 = hw[0], wkN = hw[hw.length - 1];
  const at = DATA.history.order.indexOf(DATA.publish.id);
  const from = wk1.docs ? wk1.byGroup[at] / wk1.docs : 0;
  const to = wkN.docs ? wkN.byGroup[at] / wkN.docs : 0;
  const ai = wkN.byGroup[at] ? wkN.byGroupSigned[at] / wkN.byGroup[at] : 0;
  $('say1').innerHTML = `We grouped GitHub pull requests since 2025 into <b>${f.k} clusters</b>
    of vocabulary.`;
  $('say2').innerHTML = `One cluster has grown from <b>${pc(from)}</b> of all pull requests to
    <b>${pc(to)}</b>, and <b>${pc(ai)}</b> of it is signed by the AI tool that wrote it.`;
  $('say3').innerHTML = `Its most representative words should look familiar to anyone who uses coding
    agents.`;

  GROUP = Math.max(0, DATA.browse.findIndex((g) => g.published));
  showGroup();

  $('q').oninput = () => fillList($('q').value);
  $('prev').onclick = () => { GROUP = (GROUP - 1 + DATA.browse.length) % DATA.browse.length; showGroup(); };
  $('next').onclick = () => { GROUP = (GROUP + 1) % DATA.browse.length; showGroup(); };
  addEventListener('keydown', (e) => {
    if (document.activeElement === $('q')) return;
    if (e.key === 'ArrowLeft') $('prev').click();
    if (e.key === 'ArrowRight') $('next').click();
  });
  // Charts are sized from their cell, so they have to be redrawn when it changes.
  new ResizeObserver(() => { drawArrive(); if (SELECTED) drawRate(); })
    .observe(document.querySelector('.chart'));
}

function showGroup() {
  const g = groupAt();
  const pad2 = (n) => String(n).padStart(2, '0');
  $('which').textContent = `${pad2(GROUP + 1)} / ${pad2(DATA.browse.length)}`;
  $('about').textContent = `${fmt(g.size)} pull requests · ${pc(g.stamped)} signed by an AI tool · most representative first`;
  $('q').value = '';
  drawArrive();
  fillList('');
  select((rows()[0] || {}).w);
}

/* measure a plot cell, in CSS pixels */
function box(svg) {
  const r = svg.getBoundingClientRect();
  return { W: Math.max(240, Math.round(r.width) || 700), H: Math.max(120, Math.round(r.height) || 220) };
}

/* ---- every group's share of the corpus, week by week -------------------- */
/* The fit is on the last forty days; every week ever sampled is then assigned
   to those groups. So this is one fixed set of groups seen across the whole
   archive, not a fit repeated per week, and the register rising from about one
   per cent to about a fifth is a fact about the corpus rather than about the
   clustering. */
function drawArrive() {
  const svg = $('arrive'), H0 = DATA.history;
  if (!H0 || !H0.weeks.length) return;
  const { W, H } = box(svg);
  const L = 32, R = 6, T = 8, B = 18;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const S = H0.weeks, order = H0.order, reg = groupAt().id;
  const x = (i) => L + (i / Math.max(1, S.length - 1)) * (W - L - R);
  const y = (v) => T + (1 - v) * (H - T - B);
  const parts = [];
  for (const g of [0.25, 0.5, 0.75]) {
    parts.push(`<line class="grid" x1="${L}" x2="${W - R}" y1="${y(g).toFixed(1)}" y2="${y(g).toFixed(1)}"/>`);
    parts.push(`<text class="axis" x="${L - 5}" y="${(y(g) + 3).toFixed(1)}" text-anchor="end">${g * 100}%</text>`);
  }
  const base = new Array(S.length).fill(0);
  const band = (c, fill, op) => {
    const at = order.indexOf(c);
    const share = S[S.length - 1].docs ? S[S.length - 1].byGroup[at] / S[S.length - 1].docs : 0;
    const upper = S.map((e, i) => base[i] + (e.docs ? e.byGroup[at] / e.docs : 0));
    const d = upper.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('')
      + base.map((v, i) => [i, v]).reverse().map(([i, v]) => `L${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('') + 'Z';
    parts.push(`<path d="${d}" fill="${fill}" fill-opacity="${op}" stroke="var(--paper)" stroke-width="0.9"
      stroke-opacity=".55"><title>group ${c}: ${pc(share)} of the last week</title></path>`);
    for (let i = 0; i < S.length; i++) base[i] = upper[i];
  };
  // The stacking order never changes, and neither does a band's shade. Paging
  // recolours one band; it must not reshuffle the chart underneath the reader,
  // which is what happened when the selected cluster was drawn first so that it
  // sat at the bottom.
  const steps = [0.46, 0.34, 0.24, 0.16, 0.11, 0.08, 0.06];
  order.forEach((c, i) => band(c, c === reg ? 'var(--flag)' : 'var(--muted)',
                               c === reg ? 0.85 : steps[i % steps.length]));
  let last = null;
  const every = Math.max(1, Math.round(S.length / (W < 560 ? 4 : 8)));
  for (let i = 0; i < S.length; i += every) {
    const q = `${S[i].w.slice(0, 4)} Q${Math.floor(+S[i].w.slice(5, 7) / 3.01) + 1}`;
    if (q === last) continue;
    last = q;
    parts.push(`<text class="axis" x="${x(i).toFixed(1)}" y="${H - 5}" text-anchor="middle">${q}</text>`);
  }
  svg.innerHTML = `<title id="arrive-t">Each group's share of all sampled descriptions, by week</title>` + parts.join('');
  const at = order.indexOf(reg), f = S[0], l = S[S.length - 1];
  const sh = (e) => (e.docs ? e.byGroup[at] / e.docs : 0);
  const sg = (e) => (e.byGroup[at] ? e.byGroupSigned[at] / e.byGroup[at] : 0);
  $('acap').innerHTML = `<b>${pc(sh(f))}</b> of pull requests in ${f.w.slice(0, 7)} ` +
    `&rarr; <b>${pc(sh(l))}</b> in ${l.w.slice(0, 7)}`;
}

/* ---- the list ----------------------------------------------------------- */
function fillList(filter) {
  const q = filter.trim().toLowerCase();
  const R = rows().filter((w) => !q || w.w.includes(q));
  $('list').innerHTML = R.slice(0, 400).map((w) => `
    <li data-w="${esc(w.w)}" role="option" aria-selected="false">
      <span class="n">${w.rank}</span>
      <span class="w">${esc(w.w)}</span>
      <span class="x">${w.lift.toFixed(1)}&times;</span>
    </li>`).join('');
  for (const li of $('list').querySelectorAll('li')) li.onclick = () => select(li.dataset.w);
  if (SELECTED) for (const li of $('list').querySelectorAll('li'))
    li.setAttribute('aria-selected', String(li.dataset.w === SELECTED));
}

/* ---- the selected word -------------------------------------------------- */
function select(word) {
  if (!word) { $('whead').innerHTML = '<div class="u">Pick a word.</div>'; $('rate').innerHTML = ''; return; }
  const w = rows().find((x) => x.w === word);
  if (!w) return;
  SELECTED = word;
  for (const li of $('list').querySelectorAll('li'))
    li.setAttribute('aria-selected', String(li.dataset.w === word));
  const st = wordStats(w);
  $('whead').innerHTML = `
    <div class="big">
      <span class="w">${esc(w.w)}</span>
      <span class="x">${w.lift.toFixed(1)}&times;</span>
      <span class="u">more frequent in this cluster</span>
    </div>
    <div class="facts">
      ${st ? `<span><b>${Math.round(st.peak)}</b> per million, at the peak</span>
              <span><b>${st.corpus.toFixed(1)}</b> per million across all pull requests</span>
              <span class="sig"><b>${st.signed.toFixed(1)}</b> per million in AI-signed pull requests</span>`
            : '<span>no weekly history kept for this word</span>'}
    </div>`;
  drawRate();
}

function wordStats(w) {
  const H0 = DATA.history, i = H0 ? H0.words.indexOf(w.w) : -1;
  if (i < 0) return null;
  const S = H0.weeks;
  const totW = S.reduce((a, e) => a + e.words, 0), totS = S.reduce((a, e) => a + e.wordsSigned, 0);
  const tot = S.reduce((a, e) => a + e.counts[i], 0), ts = S.reduce((a, e) => a + e.countsSigned[i], 0);
  return { i, S,
    all: S.map((e) => (e.words ? 1e6 * e.counts[i] / e.words : 0)),
    sgn: S.map((e) => (e.wordsSigned ? 1e6 * e.countsSigned[i] / e.wordsSigned : 0)),
    peak: Math.max(...S.map((e) => (e.words ? 1e6 * e.counts[i] / e.words : 0))),
    corpus: totW ? 1e6 * tot / totW : 0,
    signed: totS ? 1e6 * ts / totS : 0,
    unsigned: (totW - totS) ? 1e6 * (tot - ts) / (totW - totS) : 0 };
}

/* How often the word has actually been written, per million words, every week
   since the archive starts — and the same restricted to signed descriptions.
   Two lines rather than one because that is the confirmation: the ranking never
   looked at a date or at a signature, so if the grey line climbs and the red one
   sits well above it, two independent things agree about the word. */
function drawRate() {
  const svg = $('rate');
  const w = rows().find((x) => x.w === SELECTED);
  const st = w && wordStats(w);
  if (!st) { svg.innerHTML = ''; return; }
  const { W, H } = box(svg);
  const L = 36, R = 6, T = 16, B = 18;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const S = st.S;
  const hi = Math.max(1, ...st.sgn, st.peak);
  const x = (k) => L + (k / Math.max(1, S.length - 1)) * (W - L - R);
  const y = (v) => T + (1 - v / hi) * (H - T - B);
  const parts = [];
  for (const g of [hi / 2, hi]) {
    parts.push(`<line class="grid" x1="${L}" x2="${W - R}" y1="${y(g).toFixed(1)}" y2="${y(g).toFixed(1)}"/>`);
    parts.push(`<text class="axis" x="${L - 5}" y="${(y(g) + 3).toFixed(1)}" text-anchor="end">${Math.round(g)}</text>`);
  }
  const line = (vals, stroke, wd, op) =>
    `<path d="${vals.map((v, k) => `${k ? 'L' : 'M'}${x(k).toFixed(1)},${y(v).toFixed(1)}`).join('')}"
      fill="none" stroke="${stroke}" stroke-width="${wd}" stroke-opacity="${op}"/>`;
  parts.push(line(st.all, 'var(--muted)', 1.4, 0.85));
  parts.push(line(st.sgn, 'var(--flag)', 1.8, 1));
  parts.push(`<text class="axis" x="${L}" y="${T - 5}">per million words &mdash; <tspan fill="var(--flag)">signed</tspan> against <tspan fill="var(--muted)">all</tspan></text>`);
  let last = null;
  const every = Math.max(1, Math.round(S.length / 6));
  for (let k = 0; k < S.length; k += every) {
    const q = `${S[k].w.slice(0, 4)} Q${Math.floor(+S[k].w.slice(5, 7) / 3.01) + 1}`;
    if (q === last) continue;
    last = q;
    parts.push(`<text class="axis" x="${x(k).toFixed(1)}" y="${H - 5}" text-anchor="middle">${q}</text>`);
  }
  svg.innerHTML = `<title id="rate-t">${esc(SELECTED)} per million words each week</title>` + parts.join('');
}

</script>
</body>
</html>
