<!DOCTYPE html>
<html lang="en" data-status="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slop</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='26' font-family='Georgia,serif' fill='%23C2403C'%3E%C2%B6%3C/text%3E%3C/svg%3E">
<style>
/* No UI. This page exists to turn a URL into a result: readable by a person,
   scrapeable by a headless browser, postMessage-able into an iframe. */
:root{ --bg:#fff; --fg:#17191E; --dim:#767982; --flag:#C2403C; --ok:#1E7A46; color-scheme:light }
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){ --bg:#15171B; --fg:#E9E9E4; --dim:#8C8F97; --flag:#E4665C; --ok:#5FBE86; color-scheme:dark }
}
:root[data-theme=dark]{ --bg:#15171B; --fg:#E9E9E4; --dim:#8C8F97; --flag:#E4665C; --ok:#5FBE86; color-scheme:dark }
body{
  margin:0; padding:18px 20px 40px; background:var(--bg); color:var(--fg);
  font:13px/1.6 "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
pre{margin:0;white-space:pre-wrap;word-break:break-word}
.hd{color:var(--dim);font-size:11.5px;margin:0 0 14px;display:flex;gap:10px;flex-wrap:wrap}
.hd a{color:var(--dim)}
.rule{color:var(--flag)}
.loc{color:var(--dim)}
.fix{color:var(--dim)}
.sum{margin-top:14px;padding-top:10px;border-top:1px solid var(--dim);color:var(--dim)}
.sum b{color:var(--fg)}
.clean b{color:var(--ok)}
.err{color:var(--flag)}
</style>
</head>
<body>
<p class="hd">
  <span>slop</span>
  <span id="status">running…</span>
  <a href="./" id="open-ui">open in the full UI →</a>
</p>
<pre id="out"></pre>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const P = new URLSearchParams(location.hash.replace(/^#/, '') || location.search.replace(/^\?/, ''));

function finish(status, payload) {
  document.documentElement.dataset.status = status;
  $('status').textContent = status;
  // Three ways out, so this page is usable without a human: read the DOM, read
  // the global, or receive it in a parent frame.
  window.slopResult = payload;
  if (parent !== window) parent.postMessage({ source:'slop', status, ...payload }, '*');
}

function fail(msg) {
  $('out').innerHTML = `<span class="err">${esc(msg)}</span>`;
  document.title = 'slop: error';
  finish('error', { error: msg });
}

const b64urlToBytes = (s) => {
  const b = atob(s.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(s.length/4)*4,'='));
  return Uint8Array.from(b, (c) => c.charCodeAt(0));
};
const gunzip = async (bytes) =>
  new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();

async function main() {
  $('open-ui').href = './' + location.hash;
  let kind = P.get('kind') || 'md';
  let name = P.get('name') || 'input';
  let src = '';

  try {
    if (P.get('gz')) src = await gunzip(b64urlToBytes(P.get('gz')));
    else if (P.get('text')) src = new TextDecoder().decode(b64urlToBytes(P.get('text')));
    else if (P.get('url')) {
      const u = P.get('url');
      name = u;
      const res = await fetch(u, { redirect:'follow' });
      if (!res.ok) throw new Error(`HTTP ${res.status} fetching ${u}`);
      src = await res.text();
      if (!P.get('kind') && /html/i.test(res.headers.get('content-type') || '')) kind = 'html';
    } else {
      return fail('Nothing to check. Pass #gz=, #text= or #url= — see the full UI for the syntax.');
    }
  } catch (e) {
    return fail(`could not read the input: ${e.message}`);
  }

  // Rule sets: the built-ins, plus any #rules= URLs.
  const sets = [];
  try {
    for (const f of (await (await fetch('../rules/index.json')).json()).sets) {
      sets.push(await (await fetch('../rules/' + f)).json());
    }
    for (const u of P.getAll('rules')) {
      const set = await (await fetch(u)).json();
      if (!Array.isArray(set.rules)) throw new Error(`rule set ${u}: no "rules" array`);
      set.name = set.name || u.split('/').pop().replace(/\.json$/, '');
      sets.push(set);
    }
  } catch (e) {
    return fail(`could not load rules: ${e.message}`);
  }

  const sel = (P.get('select') || '').split(',').filter(Boolean);
  const ign = (P.get('ignore') || '').split(',').filter(Boolean);
  const active = new Set();
  for (const s of sets) for (const r of s.rules) {
    if (sel.length ? (sel.includes(s.name) || sel.includes(r.id)) : r.default !== 'off') active.add(r.id);
  }
  for (const i of ign) {
    const set = sets.find((s) => s.name === i);
    if (set) set.rules.forEach((r) => active.delete(r.id)); else active.delete(i);
  }

  // Same worker the UI uses, same timeout, for the same reason.
  const worker = new Worker('./worker.mjs', { type:'module' });
  await new Promise((r) => {
    const f = (e) => { if (e.data && e.data.ready) { worker.removeEventListener('message', f); r(); } };
    worker.addEventListener('message', f);
  });
  const res = await new Promise((resolve) => {
    const t = setTimeout(() => { worker.terminate(); resolve({ ok:false, error:'timed out after 20s — a rule is backtracking' }); }, 20000);
    worker.addEventListener('message', (e) => { clearTimeout(t); resolve(e.data); }, { once:true });
    worker.postMessage({ mode:'check', src, kind, sets, active:[...active] });
  });
  if (!res.ok) return fail(res.error);

  const findings = res.findings.map((f) => ({
    file: name, line: f.line, col: f.col, rule: f.rule, set: f.set,
    severity: f.severity || 'warn', match: f.match, sentence: f.sentence,
    why: f.why, suggest: f.suggest
  }));
  const per1000 = res.words ? +(findings.length / res.words * 1000).toFixed(2) : 0;
  const payload = { file:name, words:res.words, total:findings.length, per1000, findings };

  const format = P.get('format') || 'text';
  if (format === 'json') {
    $('out').textContent = JSON.stringify(payload, null, 2);
  } else {
    const pad = (s, n) => String(s).padEnd(n);
    const clip = (s, n) => { const c = s.replace(/\s+/g, ' ').trim(); return c.length > n ? c.slice(0, n - 1) + '…' : c; };
    let out = `${esc(name)} (${res.words} words, ${findings.length} findings)\n`;
    for (const f of findings) {
      out += `  <span class="loc">${pad(f.line + ':' + f.col, 9)}</span> <span class="rule">${esc(pad(f.rule, 21))}</span> ${esc(clip(f.match, 88))}\n`;
      if (f.suggest) out += `            <span class="fix">fix: ${esc(f.suggest)}</span>\n`;
    }
    out += `\n<span class="sum${findings.length ? '' : ' clean'}"><b>${findings.length} findings</b> in ${res.words} words — ${per1000} per 1000</span>`;
    $('out').innerHTML = out;
  }
  document.title = `slop: ${findings.length} finding${findings.length === 1 ? '' : 's'}`;
  finish('done', payload);
}

main().catch((e) => fail(e.message));
</script>
</body>
</html>
