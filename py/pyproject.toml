[project]
name = "slop"
version = "0.1.0"
description = "Prose linting with pluggable rule sets, for .md / .html / .txt"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
slop = "slop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slop"]
# The rule sets ship with the package.
artifacts = ["../rules/*.json"]
