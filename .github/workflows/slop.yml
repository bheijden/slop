name: slop
on:
  push:
  pull_request:
  # So the whole suite can be rehearsed by hand alongside the scheduled jobs.
  workflow_dispatch:

jobs:
  rules:
    name: rule tests (conformance + fudging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tests/run.mjs
      - run: node tests/tune.mjs
      - run: node tests/suggest.mjs
      # The numbers docs/vocabulary.md states about the derived rule, checked
      # against what the rule actually does. This job runs the test scripts one
      # by one rather than `npm test`, so a test added to package.json alone
      # never runs here -- which is exactly what happened to this one.
      - run: node tests/claims.mjs
      # The catalogue is generated. It listed 38 of the 117 rules that ship for
      # a while, because it was built by the tool that ports two vendor sets.
      - run: node tools/build-catalogue.mjs --check
      # So is the data behind the vocabulary page. It served a stale result for
      # a day after the derivation was rewritten, because rebuilding it was a
      # thing someone had to remember rather than a thing that was checked.
      - run: node tools/pr-page-data.mjs --check
      # And the corpus files have to match the hashes in their own index.
      - run: node tools/corpus.mjs --check

  candidates:
    name: candidate rule sets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # Candidate sets are not shipped on by default, but they are held to
      # the same bar so they do not rot between mining runs.
      - run: node tests/run.mjs candidates/*.json

  web:
    name: web smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22 for the global WebSocket the CDP connection uses. The tool
      # itself runs on 18+; only this test needs 22.
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # ubuntu-latest ships Chrome; the test skips cleanly if it ever does not.
      - run: node tests/web.mjs

  prose:
    name: lint the docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node js/cli.mjs check --format github -r .
      - run: node js/cli.mjs check -r .
