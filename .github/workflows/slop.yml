name: slop
on: [push, pull_request]

jobs:
  rules:
    name: rule tests (conformance + fudging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tests/run.mjs
      - run: node tests/tune.mjs
      - run: node tests/suggest.mjs
      # The catalogue is generated. It listed 38 of the 117 rules that ship for
      # a while, because it was built by the tool that ports two vendor sets.
      - run: node tools/build-catalogue.mjs --check

  candidates:
    name: candidate rule sets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # Candidate sets are not shipped on by default, but they are held to
      # the same bar so they do not rot between mining runs.
      - run: node tests/run.mjs candidates/*.json

  web:
    name: web smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22 for the global WebSocket the CDP connection uses. The tool
      # itself runs on 18+; only this test needs 22.
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # ubuntu-latest ships Chrome; the test skips cleanly if it ever does not.
      - run: node tests/web.mjs

  prose:
    name: lint the docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node js/cli.mjs check --format github -r .
      - run: node js/cli.mjs check -r .
