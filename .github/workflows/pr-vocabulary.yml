# Samples one more day of pull request descriptions, and re-derives the word
# list from the whole archive of them.
#
# Both run every morning, and they are still separate steps. The sample is
# cheap: ten five-minute windows, about a thousand descriptions, kept as bags
# of words with the prose thrown away. The fit is not: it clusters every day
# collected since 2025-01-01 five times over and scores the vocabulary inside
# each cluster, about two minutes in total. Keeping them apart means a fit
# that has to be thrown away does not take the day's sampling with it.
#
# The window matters and is not a detail: fitted on recent data alone the
# method scores 2 of 24 instead of 22. See research/k-and-window.md.
#
# Any day the sampler has not reached yet is filled in from the back on every
# run, so history accumulates without anyone scheduling it.
name: pr-vocabulary

on:
  schedule:
    # An hour after load-bearing, which also pushes to main. Both used to be
    # at 08:00 and had only avoided each other because GitHub staggers
    # scheduled runs by a few minutes.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "date or range to sample, default yesterday"
        default: ""
      dry_run:
        description: "rehearse: do every step, then report the push instead of making it"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pr-vocabulary
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sample yesterday
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          DAY="${{ github.event.inputs.days }}"
          [ -n "$DAY" ] || DAY=$(date -u -d yesterday +%Y-%m-%d)
          node tools/pr-sample.mjs "$DAY"

      # Gaps get filled from the back. A day already published as JSONL costs
      # one request; a day that has to be sampled costs ten searches paced
      # under the API's thirty-a-minute limit, about fifty seconds. Ten a run
      # covers either case comfortably.
      - name: Fill in any gaps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/pr-sample.mjs --backfill 10

      # Every day, not weekly. The comment this replaces said a fit took about
      # four minutes and that was why it ran on Mondays only; measured on CI it
      # takes 24 seconds, so the sweep below is about two minutes. Weekly bought
      # nothing and cost six days of drift, and it left a bad fit in place for a
      # week.
      #
      # pr-fit sweeps k = 8..12 and publishes only from a fit where the two
      # selectors agree -- see the header of tools/pr-fit.mjs. If none agree it
      # exits 3 having written nothing and the list already shipped stays. That
      # is a day without a refresh rather than a failure, so the run carries on
      # and still commits the sample.
      - name: Re-derive the list
        id: fit
        continue-on-error: true
        run: node tools/pr-fit.mjs --write

      # Runs even when the fit above was discarded: the page shows the sample
      # as well as the derivation, so a day that only samples still changes
      # what it says. A CI check fails when the page and its inputs disagree.
      - name: Rebuild what the page reads
        run: node tools/pr-page-data.mjs

      # The rule has to pass its own tests and the repo has to stay clean, or
      # nothing is committed. A vocabulary that fails its fixtures is a signal,
      # not something to publish.
      - name: The rule still has to hold up
        id: check
        if: steps.fit.outcome == 'success'
        continue-on-error: true
        run: |
          node js/cli.mjs test-rules rules/pr-vocabulary.json
          node tests/run.mjs
          node js/cli.mjs check -r .

      # The sample and the derivation arrive in the same run and are not the
      # same work. A derivation that cannot pass the rule's own examples is
      # thrown away; the day's sampling is kept. Before this the whole run
      # aborted, so the failed fit on 2026-09-07 also discarded that day's
      # sample and it had to be collected again a day later, differently.
      - name: Keep the sample, drop the derivation
        if: steps.check.outcome == 'failure'
        run: |
          git checkout -- rules/pr-vocabulary.json data/cluster.json \
                          data/cluster-series.json data/cluster-history.json
          node tools/pr-page-data.mjs
          echo "::warning::derivation discarded, sample kept, shipped list unchanged"

      # After the commit, so a discarded derivation still turns the run red
      # without costing the day's data.
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/docs data/cluster.json data/cluster-series.json \
                  data/cluster-history.json rules/pr-vocabulary.json \
                  web/vocabulary-data.json
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          # This used to read steps.when.outputs.fit, from a step that decided
          # whether it was Monday. That step went when the fit went daily, so
          # the condition was always empty and every commit said "sample" --
          # including the ones that had just republished the word list. Ask the
          # staged diff instead, which cannot go stale: the list was re-derived
          # exactly when the rule file changed.
          DAY="${{ github.event.inputs.days }}"
          [ -n "$DAY" ] || DAY=$(date -u -d yesterday +%Y-%m-%d)
          if git diff --cached --quiet -- rules/pr-vocabulary.json; then
            git commit -m "pr-vocabulary: sample $DAY"
          else
            git commit -m "pr-vocabulary: sample $DAY, re-derive the list"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "REHEARSAL — everything above ran for real. The push is what is skipped:"
            git --no-pager show --stat --oneline HEAD
          else
            # Rebase first: staggered schedules make a collision unlikely, not
            # impossible, and a rejected push fails the whole job.
            git pull --rebase --autostash -q origin main
            git push origin HEAD:main
          fi

      - name: Say if the derivation was discarded
        if: steps.check.outcome == 'failure'
        run: |
          echo "the sample was committed; the derivation was not."
          echo "the list on main is the one that was already there."
          exit 1
