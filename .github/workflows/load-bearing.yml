# Keeps rules/load-bearing.json in step with louisabraham/load-bearing.
#
# Upstream refits daily and publishes the cheapest of eight restarts, so the
# file changes most days without the vocabulary moving: measured over five days
# it was byte-identical three times and turned over 20% once, from a refit. The
# trigger here is the word list rather than the file, so quiet days cost one
# API call and nothing else. A day that does move the list commits straight to
# main once the rule has passed its own tests; a move over the ceiling fails the
# job instead, because nothing here can re-check the threshold.
name: load-bearing

on:
  schedule:
    - cron: "0 8 * * *"   # after their 06:20 UTC run has landed
  workflow_dispatch:
    inputs:
      days:
        description: "how many daily snapshots to pool"
        default: "28"
      force:
        description: "rewrite even when the list has not moved (to test this workflow)"
        type: boolean
        default: false
      dry_run:
        description: "rehearse: do every step, then report the push instead of making it"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Exits 1 when churn is over the ceiling, which is upstream changing
      # method rather than data. That is a decision to read, not to merge, so
      # the job fails and says so.
      - name: Rebuild the word list
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tools/load-bearing.mjs \
            --days "${{ github.event.inputs.days || 28 }}" \
            ${{ github.event.inputs.force == 'true' && '--bootstrap' || '' }}

      - name: Did anything change
        id: diff
        run: |
          if git diff --quiet -- rules/load-bearing.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "words<<EOF"
              node -e "const j=require('./rules/load-bearing.json');const s=j.snapshot;console.log(\`v\${j.version}, \${s.words} words pooled from \${s.snapshots} snapshots, upstream \${s.upstream}\`)"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      # The fixtures are hand-written and stay fixed. If the vocabulary has
      # moved far enough that they stop behaving, that is the signal, not a
      # thing to regenerate around.
      - name: The rule still has to pass its own tests
        if: steps.diff.outputs.changed == 'true'
        run: |
          node tests/run.mjs
          node tests/suggest.mjs
          node js/cli.mjs check -r .

      - name: Commit it
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/load-bearing.json
          git commit -m "load-bearing: refresh the vocabulary

          ${{ steps.diff.outputs.words }}

          Rebuilt from https://github.com/louisabraham/load-bearing by
          tools/load-bearing.mjs. The word list moved by more than the 10% floor,
          so this is a real refresh rather than a refit landing in the same place.

          The threshold is not re-derived here and cannot be: it was set once, by
          hand, against a corpus that is not in this repository. That is what the
          40% ceiling is for."
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "REHEARSAL — everything above ran for real. The push is what is skipped:"
            git --no-pager show --stat --oneline HEAD
          else
            # Rebase first: staggered schedules make a collision unlikely, not
            # impossible, and a rejected push fails the whole job.
            git pull --rebase --autostash -q origin main
            git push origin HEAD:main
          fi
